[package]
name = "claude-usage-monitor"
version = "0.1.0"
description = "A strip-chart recorder for the Claude 5-hour rolling window"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "claude_usage_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "6"
ureq = { version = "2", features = ["json", "tls", "proxy-from-env"] }
