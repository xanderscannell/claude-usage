<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=800, initial-scale=1" />
<title>Claude Usage</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Martian+Mono:wdth,wght@75..112.5,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div class="case">

    <header class="rail" data-tauri-drag-region>
      <div class="rail__id" data-tauri-drag-region>
        <span class="rec" aria-hidden="true"></span>
        <h1 class="wordmark">Claude Usage</h1>
        <span class="silk silk--dim unit" id="unit-mark">5-hour block</span>
      </div>

      <div class="rail__reset" data-tauri-drag-region>
        <span class="silk silk--dim" id="reset-label">Block resets in</span>
        <span class="clock" id="reset-clock">—</span>
      </div>

      <div class="rail__ctl">
        <button class="ctl" type="button" data-win="minimize" aria-label="Minimize window">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5h6" /></svg>
        </button>
        <button class="ctl ctl--close" type="button" data-win="close" aria-label="Close window">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5" /></svg>
        </button>
      </div>
    </header>

    <main class="deck">
      <section class="recorder" aria-labelledby="recorder-title">
        <h2 class="sr-only" id="recorder-title">Usage across the current 5-hour block, plotted by model</h2>
        <div class="recorder__paper">
          <svg class="chart" id="chart" viewBox="0 0 640 300" role="img" aria-label="Loading usage."></svg>
          <div class="pen" id="pen" aria-hidden="true"><span class="pen__nib"></span></div>
          <p class="paper__empty" id="paper-empty" hidden>No block open</p>
        </div>
      </section>

      <aside class="carriage">
        <div class="readout readout--hero">
          <span class="readout__value" id="pct-value">0.0</span>
          <span class="silk readout__label">% of 5-hour limit</span>
        </div>

        <div class="readout">
          <span class="readout__value readout__value--sm">
            <span id="burn-value">0.0</span><span class="readout__unit">%/hr</span>
          </span>
          <span class="silk readout__label">of limit per hour</span>
        </div>

        <div class="readout">
          <span class="readout__value readout__value--sm" id="full-value">—</span>
          <span class="silk readout__label">to limit at this rate</span>
        </div>
      </aside>
    </main>

    <section class="pens" id="pens" aria-label="Pen channels"></section>

    <footer class="rail rail--foot">
      <span class="silk silk--dim" id="weekly-label">Weekly</span>
      <span class="segbar" id="segbar" aria-hidden="true"></span>
      <span class="silk foot__pct"><b id="weekly-pct">—</b>%</span>
      <span class="silk silk--dim" id="weekly-reset"></span>
      <span class="rail__rule"></span>
      <span class="silk" id="source-state">—</span>
      <span class="silk silk--dim foot__right" id="foot-right">—</span>
    </footer>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
